[project]
name = "nusim"
version = "0.1.0"
description = "Host-side tooling (the ./b dispatcher + formatters) for the NUSim K1 MuJoCo simulator."
readme = "README.md"
requires-python = ">=3.11"
# Formatter versions are pinned to the ones NUbots uses, so the same file formats
# identically in both repos. clang-format is the PyPI wheel of the same LLVM release
# NUbots builds into its docker image (llvmorg-14.0.6) — clang-format output changes
# between major versions, so this pin is what keeps ./b format reproducible.
dependencies = [
    "clang-format==14.0.6",
    "cmakelang==0.6.13",
    "isort==5.13.2",
    "black==24.10.0",
    "termcolor==2.5.0",
]

[tool.uv]
# Pure tooling + scripts (mujoco/b.py is stdlib-only); nothing to build/install.
package = false

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ['b']
