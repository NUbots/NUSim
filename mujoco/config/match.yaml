# Embedded GameController + automatic referee (module::MatchReferee, the sim/match role).
# NUSim runs the game itself and broadcasts the same UDP control messages an external GameController
# would, so don't run the GameController app alongside sim/match. Team numbers come from the roster.

# Competition rules: a directory in the GameController's config/. middle_foundation is 3 a side on the M-Field.
competition: middle_foundation
kick_off_side: home # home or away; home is --game's first team, in the -x half

# Start the game as soon as every robot's player has taken control.
auto_start_when_connected: true
# Or this many seconds of sim time after launch. Negative waits for the above or the Start button; a
# --headless run has no button, so it uses 30 s instead.
auto_start_after: -1.0

# Go straight to Playing, for every kick-off, instead of through Ready and Set.
skip_kick_off_phases: true

# Stop robots where they are and move them into the ready pose unless the game is in Playing and
# they're not penalised. For roles that don't listen to GameController, such as nusim/behaviour; turn
# it off for roles that do. Robots aren't moved to kick-off positions.
hold_robots: true

# Seconds every penalty lasts, with no increase for repeat offences. Competition times are 45 s and up,
# which leaves a third of a match frozen with robots this prone to leaving the field. Negative keeps them.
penalty_seconds: 10

# Control messages go to the match network's broadcast address, which ./b match passes in (--broadcast).
network:
  control_interval: 0.5 # wall-clock seconds between control messages
  status_timeout: 4.0 # wall-clock seconds without a status message before a player counts as offline

autoreferee:
  # Names are game_controller_autoreferee::Features in lower case.
  # Most penalties are left out, as robots that ignore GameController can't react to them. Those that
  # remain need unpenalize, or the penalised robot is held for the rest of the game.
  features:
    - switch_to_set
    - switch_to_playing
    - switch_to_finished
    - ball_out
    - invalid_goal
    - ball_free
    # - game_stuck # local game stuck: the robot nearest a ball that hasn't moved 10 cm in 10 s goes to the touchline
    - penalize_leaving_the_field
    - unpenalize
    - clear_ball
    - place_for_penalty
    - place_ball
  time_until_switch_to_set: 5.0 # seconds
  time_until_switch_to_playing: 3.0 # seconds
  penalty_placement_distance: 0.6 # metres
  player_radius: 0.2 # metres, at ground level when upright
  stand_height: 0.555 # metres, root height a robot is placed at (the "ready" keyframe's)

# Head cameras (module::MatchCameras). Resolution and segment names come from camera.yaml.
# Every frame is a Yolo run on every robot, which is most of a match's load, so this is below a real camera's 30.
cameras_fps: 10

# HSL M-Field, matching models/k1/k1_scene_robocup_middle.xml. Letters are the rule book's.
field:
  length: 14.0 # A
  width: 9.0 # B
  goal_width: 2.5 # D
  goal_height: 1.8
  goal_area_length: 1.0 # E
  goal_area_width: 4.0 # F
  penalty_area_length: 3.0 # G
  penalty_area_width: 6.0 # H
  penalty_mark_distance: 2.0 # I
  center_circle_radius: 1.5 # J/2
  border_strip_width: 1.0 # K
  mark_radius: 0.05
  line_width: 0.05
  ball_radius: 0.0785

# ./b match's containers (tools/match.py): the sim and every robot on a docker network of their own, so the
# GameController's broadcasts and the team messages never leave it.
docker:
  network: nusim-match
  subnet: 10.1.0.0/24 # the sim is .2, robot k is .(10 + k)
  sim_container: nusim-match-sim
  sim_startup_seconds: 3 # before the robots start
  robot_cpu_shares: 256 # each robot's CPU weight; the sim has docker's default, 1024

# The codebases a team can play (./b match --home-codebase / --away-codebase, and the window's pickers).
#   number         its GameController number (the GameController's teams.yaml), so the window shows its name
# Another team's code is a fork with nusim/Dockerfile (its image) and nusim/run.sh (its entrypoint, which starts one
# robot's player from the environment every team's gets: docs/MATCH_WINDOW.md#codebases):
#   install        ./b team install <install> builds its image from its fork (repo, ref)
#   image          the image (K1SIM_<INSTALL>_IMAGE overrides it, e.g. K1SIM_BHUMAN_IMAGE=nusim-bhuman-asan)
#   low_state_hz   500: its motion runs once per LowState at 500 Hz, so the sim publishes at that rate
#   docker         extra docker run flags for its robots
teams:
  NUbots:
    number: 1
    build: /home/booster/build # where NUbots' build volume mounts in its image
    game_roles: [nusim/robocup, nusim/behaviour] # what a refereed game runs, the first that's built
  Nobody: # no player: its robots stand on the touchline, for watching the other team alone
    number: 126
  rUNSWift: # not set up: tools/match.py doesn't know how to start its player
    number: 18
  B-Human:
    number: 5
    install: bhuman
    image: nusim-bhuman
    repo: https://github.com/jpptm/NUSim-B-human.git
    ref: main
    low_state_hz: 500
    docker: [--hostname, SimulatedK1] # it finds its robot config by hostname
  HTWK:
    number: 14
    install: htwk
    image: nusim-htwk
    repo: https://github.com/jpptm/NUSim-HTWK.git
    ref: main
