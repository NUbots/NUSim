# Keyboard play with the mjlab policies (module::SkillPlayer, role sim/skills).
#
#   W A S D  without the ball: walk. W/S forward/back, A/D turn (Shift: faster). Walking up to a
#            ball picks it up (receive).
#   Q        call for a pass: the ball is rolled at the robot from wherever it is. As it comes:
#              nothing  the robot receives it (traps it)
#              W A S D  held before the touch: a first touch that sends it that way (0.9 m/s, Shift
#                       1.2), within 90 degrees of where it came from; the dribble then takes over
#              Q again  a first-time pass (3 m/s, Shift 4), aimed with W A S D or straight back
#              Space    a first-time shot: the first-time pass at 4 m/s, at the goal or W A S D
#   E        put a ball at rest at the robot's feet
#   W A S D  with the ball at its feet: dribble away from / left of / towards / right of the camera
#            (Shift: faster); nothing held = hold the ball still
#   Space    hold to wind up a shot: the longer, the harder, and W A S D swing the aim. Release to kick.
#   C        the same for an air shot (the ball lifts at about 30 degrees)
#   X        release the ball and go back to walking
#   R        stand the robot back up at its start
#   P        pause (Space is taken)
#
# The interface these settings follow is mjlab's policies/CONTROLLER_INTERFACE.md (2026-11-18); the
# policies are the 2026-11-20 real-gains set in its policies/BENCHMARKS.md.

# Exported policies (ONNX -> `actions` [1, 22]), relative to mujoco/. Joint order, default pose,
# action scale and PD gains are read from each file's metadata. Refresh them from an mjlab checkout
# with `./b skills sync`, which copies the files BENCHMARKS.md picks (the walk: the spec's).
policies:
  walk: policies/skills/walk.onnx # 75 inputs, its own gains; empty = no walking
  receive: policies/skills/receive.onnx # the walking version: works from standing and walking
  dribble: policies/skills/dribble.onnx
  kick: policies/skills/kick.onnx # from standing and out of a dribble
  kick_air: policies/skills/kick_air.onnx # C; empty = no air shot
  first_touch: policies/skills/first_touch.onnx # directional first touch; empty = always receive
  first_pass: policies/skills/first_pass.onnx # first-time pass; empty = Q doesn't pass first time
  # Used instead of `kick` when the ball is rolling as the shot is called. Empty = `kick` for
  # everything, which is what the spec now says (the kick is trained out of a dribble too).
  kick_moving: ""

# PD gains for the ball skills (receive, dribble, kick), JointIndexK1 order. Used only for a policy
# file whose own metadata gains are placeholders (kp 1, kd 0), as the exports with the motor
# torque-speed model have. Walk always uses its file's own gains. The 2026-11-20 set was trained on
# the real robot's gains (mjlab policies/BENCHMARKS.md): head 4 / 0.25, arms 10 / 1, legs 80 / 4,
# ankles 50 / 2, the same as the walk's, so there is no gain switch at a hand-over. (The 2026-11-19
# set's were the spec's section 4: legs about 18-60 / 2-5, everything else 3.948 / 0.251.)
ball_skill_gains:
  kp: [4, 4, 10, 10, 10, 10, 10, 10, 10, 10,
       80, 80, 80, 80, 50, 50, 80, 80, 80, 80, 50, 50]
  kd: [0.25, 0.25, 1, 1, 1, 1, 1, 1, 1, 1,
       4, 4, 4, 4, 2, 2, 4, 4, 4, 4, 2, 2]

# Seconds between a ball skill's step and its joint targets reaching the servos. They were trained
# with 10 to 40 ms here; with none they over-correct and the gait is visibly jittery.
action_delay: 0.025

# Seconds spent easing from the spawn pose to the pose of the starting policy, before it takes over.
blend_time: 0.5

# No policy gets the robot up. Seconds on the ground before it is stood back up at its start; 0 = wait for R.
fall_reset_after: 3.0

walk:
  # Start standing in the walk policy (W walks, Q passes) rather than waiting for a pass in receive.
  start_walking: true
  # In the robot's own frame, whatever the camera: W forward at `speed` (Shift: `fast_speed`), S back
  # at `back_speed` (m/s). A/D turn at `turn_rate` rad/s, or with side_keys: strafe step sideways at
  # `side_speed` m/s. A speed or rate of 0 turns that key off.
  # The spec trained this walk forward up to 1 m/s and found turning and sideways barely respond in
  # mjlab, asking that they are not offered until its author confirms its ranges. In NUSim it turns
  # at about the rate asked; backward and sideways are measured in docs/SKILL_KEYBOARD.md.
  speed: 1.0
  fast_speed: 2.0 # past the 1 m/s its author reports; it tracks 2.0 asked at 1.88 here without falling
  back_speed: 0.3
  turn_rate: 0.8
  side_keys: turn # turn | strafe
  side_speed: 0.3
  turn_creep: 0.3 # m/s forward added to A/D on their own: the walk does not turn standing still
  # Walking with a ball within this distance ahead hands over to receive (m; 0 = never). After X,
  # the ball has to get 0.4 m further away than this before it is picked up again.
  pickup_distance: 0.8
  # Seconds before walk targets reach the servos. mjlab ran it with none.
  action_delay: 0.0

dribble:
  speed: 0.8 # m/s asked of the ball while a direction is held (trained 0.4 to 1.8)
  fast_speed: 1.8 # with Shift; the ball reaches about 1.4 m/s
  # view:  W/A/S/D send the ball away from / left of / towards / right of the viewer's camera, so
  #        they match what is on screen however the view is turned. Headless, the view looks along +y.
  # field: towards +x / +y / -x / -y of the field.
  # robot: relative to the robot's heading (W = straight ahead of it).
  frame: view

shoot:
  # Speed asked of the ball (trained 2 to 7 m/s; it leaves about 1.05-1.14x that in mjlab): min_speed
  # for a tap of Space (or C), rising to max_speed once it has been held for charge_time seconds.
  min_speed: 2.0
  max_speed: 7.0
  charge_time: 2.0
  # The aim starts at the point below (`goal`) or straight ahead of the robot (`heading`), and swings
  # towards the W/A/S/D direction held at aim_rate rad/s. It stays within 135 degrees of the robot's
  # heading, and within 45 degrees once the power is above 4.5 m/s.
  aim: goal
  aim_rate: 2.0
  goal: [7.0, 0.0] # centre of the +x goal on the middle field
  # Space does nothing unless the ball is within `reach` m of the robot and within `cone_deg` of its
  # heading (the kick was trained with the ball in front).
  reach: 1.0
  cone_deg: 60.0

# A pass's first touch. Directions are kept within 90 degrees of where the pass came from: sideways
# or back towards the passer, never on past the robot.
first_touch:
  speed: 0.9 # m/s off the touch (trained 0.5 to 1.2)
  fast_speed: 1.2 # with Shift
  window: 0.4 # s after the touch before the dribble takes over (the trained touch window)
  timeout: 4.0 # s after the pass with no touch: give up and receive
first_pass:
  speed: 3.0 # m/s off the touch (trained 2 to 4)
  fast_speed: 4.0 # with Shift
  # Space (or C) with a pass rolling in shoots it first time with this policy, at this speed, aimed at
  # shoot.goal unless a direction is held. There is no first-time air shot.
  shot_speed: 4.0

receive:
  # Receive hands over to dribble once the ball has sat still at the robot's feet for this long.
  settle_time: 0.5
  # With no pass rolling in, a direction key takes over from receive straight away if the ball is
  # within this distance (m) and slower than takeover_speed (m/s). Beyond that distance, W walks.
  takeover_distance: 1.0
  takeover_speed: 0.8

# The pass Q rolls at the robot, each value drawn from its range. Trained: up to 4 m away, within
# 0.84 rad (48 degrees) of straight ahead, arriving at up to 3.5 m/s, up to 0.45 m to the side. A pass from outside that range is still played,
# with a warning on the status line.
pass:
  # ball:  roll it from wherever the ball is now (nothing happens if it is within min_distance m).
  # spawn: first put it `distance` m away at `bearing` rad off the robot's heading.
  from: ball
  min_distance: 1.0
  distance: [2.5, 3.5] # spawn only
  bearing: [-0.5, 0.5] # spawn only
  offset: [-0.25, 0.25] # m to the side of the robot the pass is aimed at
  arrival_speed: [1.5, 2.5] # m/s as it reaches the robot
  rolling_decel: 0.9 # m/s^2 the ball loses rolling on this field; sets the launch speed

# The ball's contact with the robot. The policies were trained (mjlab, from 2026-11-18) with explicit
# foot-ball contacts of friction 0.3 and solref (0.02, 0.35): a little springy, so the ball comes off a
# foot about 1.4x as fast as the foot hits it. NUSim's scene has none, so its ball-robot contact is
# critically damped and the ball barely springs at all, which matters most for first touches and
# first-time passes. match_mjlab sets the ball's own friction and solref to these (the ball has
# priority in its contacts with the robot); ball-floor rolling comes from the scene's explicit pair
# and doesn't change. Only this role is affected.
ball_contact:
  match_mjlab: true
  friction: 0.3
  solref: [0.02, 0.35]

# The rondo, from the viewer's Training buttons (needs 4 robots; ./b skills spawns them). Three
# teammates stand at the corners of a triangle facing in, one with the ball at its feet; the fourth
# stands in the middle and walks at the ball as fast as the walk goes. The keys play whichever
# teammate the ball is rolling to: a shot (Space) aims at the teammate whose passing lane is further
# from the defender, powered so a tap reaches them at arrival_speed; W A S D still swing it, and let
# go within snap_deg of a teammate it locks onto them. A first-time pass (Q as it comes) goes to the
# same teammate, or with a direction held to the teammate within key_snap_deg of it. A pass only
# goes into receive for a teammate it will roll to (within receive_reach m of its feet, before it
# stops); one that reaches nobody goes to whoever is nearest where it stops, in walk, to go and get
# it. The round starts again when the defender's body touches the ball (bumping a robot doesn't
# count) or it rolls out_margin beyond the corners; R starts it again at once.
#
# rondo_defend (the Defend button): you play the robot in the middle with W A S D, and the computer
# plays the three. It passes to the open teammate (a lane at least ai_lane_open m from you) after
# holding the ball ai_hold s, or at once with you within ai_pressure m; pressed with no lane open it
# dribbles away from you; with you within ai_first_time m of the receiver it passes first time.
rondo:
  centre: [0.0, 0.0]
  side: 4.0 # m between teammates (receive was trained on passes from up to 4 m)
  ball_ahead: 0.3 # m in front of the starting teammate
  defender_speed: 2.0 # m/s, the walk's top speed
  defender_turn_rate: 1.0 # rad/s
  defender_delay: 2.0 # s after the round starts before the defender sets off
  defender_accel: 3.0 # m/s^2: its walking speed changes no faster (the walk falls on a jump to standing)
  defender_close_speed: 0.6 # m/s at the ball, rising 1.5 m/s per metre away, so it doesn't run through robots
  defender_lead: 1.0 # s it looks ahead along the ball's roll, at most
  receive_reach: 0.6 # m to the side of a pass's path a teammate can still receive it (trained to 0.45)
  out_margin: 2.0
  next_round: 1.5 # s after an interception or a lost ball
  # Teammates off the ball walk back to their corner, facing the ball, and step sideways off it
  # (up to support_shift m) while the defender stands within lane_clear m of the lane from the ball.
  support_speed: 0.8 # m/s
  support_tolerance: 0.4 # m from their spot before they move again
  lane_clear: 0.8 # m
  support_shift: 1.2 # m
  arrival_speed: 1.8 # m/s
  snap_deg: 10
  key_snap_deg: 30
  chase_speed: 0.8 # m/s a computer teammate walks to a loose ball at
  ai_hold: [0.6, 1.8] # s
  ai_pressure: 1.6 # m
  ai_lane_open: 0.7 # m
  ai_first_time: 1.8 # m
  # Defending (rondo_defend, rondo_ekf, rondo_solo): the ball getting away before this many passes is
  # your win too (you pressed them into losing it).
  forced_win_passes: 8

# rondo_ekf (the "Shared eyes (EKF)" button): rondo_defend on a wider triangle, where the three
# don't know where you are. Each one's head camera (the model's, as its view down the left of the
# window shows) detects you when your trunk is in its image, within `range`, and not hidden behind
# another robot or the ball, missing you anyway a `miss` fraction of frames; each reports `rate`
# times a second, a range (sigma_range + sigma_range_per_m per metre: from your size in the image)
# and a bearing (sigma_bearing_deg). All three feed one shared EKF of your position and velocity
# (constant velocity, white acceleration accel_sigma, the velocity fading over velocity_tau s,
# detections gated at Mahalanobis^2 `gate`, a new track after reinit_after gated out in a row), and
# the computer plays against that track, keeping its lanes clear by its 1-sigma doubt too. A track
# vaguer than lost_sigma m is no use: they assume you're in the middle.
rondo_ekf:
  side: 5.5 # m between teammates (rondo.side is 4)
  rate: 15 # Hz per camera
  range: 8.0 # m
  sigma_bearing_deg: 1.7
  sigma_range: 0.10 # m
  sigma_range_per_m: 0.12 # m per m away
  miss: 0.1
  accel_sigma: 2.5 # m/s^2
  velocity_tau: 1.5 # s
  init_speed_sigma: 1.0 # m/s
  gate: 13.8
  reinit_after: 8
  lost_sigma: 2.0 # m
  aspect: 1.22 # the camera views' width / height (the K1's 106 x 95 degree lens)
  truth_marker: true # draw the track's error, a red line from where you really are

# rondo_solo (the "Solo eyes" button): the same with no communication. Each teammate keeps its own EKF
# (the same settings) of only what its own camera sees, and makes its own decisions from that alone.

# The drill to start in: free, rondo, rondo_defend, rondo_ekf or rondo_solo (then switch with the Training buttons).
drill: free

# Where the robots free play doesn't use stand (x, y), facing the field: off the -y touchline.
park: [[2.5, -5.0], [3.5, -5.0], [4.5, -5.0]]

# The head camera the ball observation imitates (ground truth cut to a field of view, no noise).
camera:
  offset: [0.06, 0.0, 0.07] # m, in the Head_2 body frame
  hfov_deg: 106.2 # the K1 head camera's calibration, as the 2026-11-18 policies were trained with
  vfov_deg: 95.0
  range: 9.0 # m: the 2026-11-20 receive / first-touch policies were trained to 9 m (5 m before)

# Key presses at given sim times, for running without a keyboard (e.g. --headless):
#   script:
#     - [3.0, tap, Q]
#     - [9.0, press, W]
#     - [13.0, release, W]
#     - [13.5, tap, space]
script: []
