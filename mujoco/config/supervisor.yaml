# GameController supervisor (module::Supervisor): watches the GameController UDP broadcast and
# places bodies per game phase. Idle when no GameController is on the network.

# Off by default: with NUbots on the same host (--network host), binding port 3838 here steals it
# from NUbots' GameController ("Address already in use"). Enable only when running the sim alone.
enabled: false
gc_port: 3838 # RoboCup GameController broadcast port (protocol version 20)

# Extra ball-centre resets on top of the kickoff rule (entering READY or PLAYING).
reset_ball_on:
  finished: true # end of a half/game
  goal: true # either team's score increments
  half_change: true # first_half flag flips

# Field geometry reference (models/k1/k1_scene_robocup.xml): playing area
# 9x6 m centred on the origin (touchlines y=+-3.0, goal lines x=+-4.5),
# floor plane extends to +-5.5 x +-4.0 (the 1 m border), centre circle
# radius 0.75 m.
ball:
  enabled: true
  body: ball
  geom: ball
  x: 0.0
  y: 0.0
  z: -1.0 # < 0 => rest exactly on the floor at the geom's own radius

# One entry per managed robot body. team_id >= 0 selects the packet Team with that team_id;
# otherwise team_index picks packet slot 0 or 1. player_id is 1-based.
robots:
  - body: Trunk # K1_22dof.xml's root body (freejoint "root")
    team_id: -1
    team_index: 0
    player_id: 1
    # Kickoff spawn, matching k1_scene_robocup.xml's "kickoff" keyframe: facing +x towards the
    # ball, at the ready pose's base height.
    home_pose: {x: -2.71, y: 0.0, z: 0.555, yaw: 0.0}
    # Approximate penalty spot just outside the y = 3.0 touchline, still on the floor (which
    # extends to y = 4.0). RoboCup's per-player spacing isn't modelled.
    penalty_pose: {x: 2.0, y: 3.5, z: 0.555, yaw: 0.0}
