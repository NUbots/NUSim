# Head camera -> shared-memory bridge (module::Camera)
#
# Renders the MJCF "head" camera offscreen and publishes rgb8 frames into a shared-memory segment
# laid out like NUbots' input::K1Camera SharedImageHeader. `segment` must match the `segment:` of
# the "Left Camera" entry in NUbots_K1's module/input/K1Camera/data/config/K1Camera.yaml. The right
# camera isn't rendered; K1Camera retries it harmlessly.
#
# Intrinsics aren't configured here: they come from the MJCF camera's fovy and width/height. MuJoCo
# is an ideal pinhole, so the principal point is the image centre and k1/k2 are 0.

segment: _boostercamera_head_rgb

# Head-pose segment (K1Sensors' "NBPO" layout): the head frame in the yaw-only base footprint frame
# (see shared/sim/HeadPose.hpp). Current NUbots_K1 reads this pose over DDS (rt/head_pose); the
# segment only serves older K1Sensors builds. Empty disables.
pose_segment: _head_pose

# The real K1 head camera ("Left Camera": rectilinear, normalised focal length 0.3725, 106.6 x 95.7
# deg field of view); the MJCF camera's fovy matches. A frame is width*height*3 bytes (rgb8) and must
# fit K1Camera's 2 MiB MAX_IMAGE_BYTES and MuJoCo's default 640x480 offscreen buffer.
width: 544
height: 448
fps: 30

# Name of the <camera> element the model attaches to the head (see
# models/k1/K1_22dof.xml's Head_2 body).
mjcf_camera: head
