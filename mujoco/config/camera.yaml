# Head camera offscreen render -> DDS (module::Camera + module::SdkBridge)
#
# Renders the MJCF "head" camera (models/k1/K1_22dof.xml, mounted on the
# Head_2 body) offscreen at width x height @ fps. module::SdkBridge publishes
# each frame as a sensor_msgs Image (rgb8) on `topic`, with its CameraInfo on
# `<topic>/camera_info` -- the pair the robot's camera driver publishes and
# NUbots_K1's input::K1Camera subscribes to. `topic` must match the entry's
# `topic:` in NUbots_K1's module/input/K1Camera/data/config/K1Camera.yaml
# (default below matches that file's "Left Camera" entry). The right camera is
# not rendered yet; stereo is future work.
#
# Lens intrinsics are NOT configured here -- they're derived at runtime from the
# MJCF camera's fovy + width/height below (MuJoCo is an ideal pinhole: the
# principal point is always the image centre and there is no distortion model).
# See module/Camera/src/Camera.cpp.
topic: rt/boostercamera/head/rgb # empty disables the DDS camera

# Legacy shared-memory copy of each frame, laid out byte-for-byte as NUbots_K1's
# input::NUSimCamera reads it -- the roles/nusim/* roles on jmontano/nusim-local
# and the branches built on it. Local to this machine only. Empty disables;
# remove once nothing uses NUSimCamera.
segment: _boostercamera_head_rgb

# Head-pose shared-memory segment (the NUbridge-era K1Sensors "NBPO" layout).
# Head frame (0.08 m above Head_pitch, as the robot reports it; see
# shared/sim/HeadPose.hpp) in the yaw-only base footprint frame. Current NUbots_K1
# reads this pose over DDS instead (rt/head_pose, published by module::SdkBridge
# from the same computation); this segment only serves older K1Sensors builds
# that still read `head_pose: - segment:`. Empty string disables.
pose_segment: _head_pose

# rgb8, so each frame is width*height*3 bytes -- 640x480 (921600 bytes, ~221
# Mbit/s at 30 fps when the image crosses a network) stays well under
# NUSimCamera's 2 MiB MAX_IMAGE_BYTES and matches the MuJoCo default offscreen
# buffer size (models/k1/K1_22dof.xml and the scene files don't override
# <visual><global offwidth/offheight/>).
width: 640
height: 480
fps: 30

# Name of the <camera> element the model attaches to the head (see
# models/k1/K1_22dof.xml's Head_2 body).
mjcf_camera: head
